<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="phaseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="arrowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2ECC71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27AE60;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000030"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="url(#arrowGradient)" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#F8F9FA"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" fill="#2C3E50" font-family="Arial, sans-serif" font-size="24" font-weight="bold">
    Software Development Life Cycle (SDLC)
  </text>
  
  <!-- Center text -->
  <text x="400" y="295" text-anchor="middle" fill="#2C3E50" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
    SDLC
  </text>
  <text x="400" y="315" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="12">
    Continuous Cycle
  </text>
  
  <!-- Circular path for reference (invisible) -->
  <circle cx="400" cy="300" r="160" fill="none" stroke="none"/>
  
  <!-- Phase 1: Planning and Analysis (top) -->
  <g id="phase1">
    <rect x="330" y="110" width="140" height="50" rx="8" fill="url(#phaseGradient)" filter="url(#shadow)"/>
    <text x="400" y="125" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">
      1. Planning &amp; Analysis
    </text>
    <text x="400" y="140" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="8">
      Define scope &amp; goals
    </text>
    <text x="400" y="152" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="8">
      Project purpose
    </text>
  </g>
  
  <!-- Phase 2: Defining Requirements (top-right) -->
  <g id="phase2">
    <rect x="520" y="170" width="140" height="50" rx="8" fill="url(#phaseGradient)" filter="url(#shadow)"/>
    <text x="590" y="185" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">
      2. Defining Requirements
    </text>
    <text x="590" y="200" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="8">
      Detailed specifications
    </text>
    <text x="590" y="212" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="8">
      Actionable requirements
    </text>
  </g>
  
  <!-- Phase 3: Design (right) -->
  <g id="phase3">
    <rect x="540" y="275" width="140" height="50" rx="8" fill="url(#phaseGradient)" filter="url(#shadow)"/>
    <text x="610" y="290" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">
      3. Design
    </text>
    <text x="610" y="305" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="8">
      Architecture &amp; blueprints
    </text>
    <text x="610" y="317" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="8">
      User flows, wireframes
    </text>
  </g>
  
  <!-- Phase 4: Development (bottom-right) -->
  <g id="phase4">
    <rect x="520" y="380" width="140" height="50" rx="8" fill="url(#phaseGradient)" filter="url(#shadow)"/>
    <text x="590" y="395" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">
      4. Development
    </text>
    <text x="590" y="410" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="8">
      Coding &amp; implementation
    </text>
    <text x="590" y="422" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="8">
      Based on design
    </text>
  </g>
  
  <!-- Phase 5: Testing (bottom) -->
  <g id="phase5">
    <rect x="330" y="440" width="140" height="50" rx="8" fill="url(#phaseGradient)" filter="url(#shadow)"/>
    <text x="400" y="455" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">
      5. Testing
    </text>
    <text x="400" y="470" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="8">
      Quality assurance
    </text>
    <text x="400" y="482" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="8">
      Performance &amp; security
    </text>
  </g>
  
  <!-- Phase 6: Deployment (bottom-left) -->
  <g id="phase6">
    <rect x="140" y="380" width="140" height="50" rx="8" fill="url(#phaseGradient)" filter="url(#shadow)"/>
    <text x="210" y="395" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">
      6. Deployment
    </text>
    <text x="210" y="410" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="8">
      Release to production
    </text>
    <text x="210" y="422" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="8">
      Controlled environment
    </text>
  </g>
  
  <!-- Phase 7: Maintenance (left) -->
  <g id="phase7">
    <rect x="120" y="275" width="140" height="50" rx="8" fill="url(#phaseGradient)" filter="url(#shadow)"/>
    <text x="190" y="290" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">
      7. Maintenance
    </text>
    <text x="190" y="305" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="8">
      Ongoing support
    </text>
    <text x="190" y="317" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="8">
      Bug fixes &amp; updates
    </text>
  </g>
  
  <!-- Circular arrows connecting phases -->
  <!-- Arrow 1 to 2 -->
  <path d="M 460 150 Q 520 130 540 180" stroke="url(#arrowGradient)" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow 2 to 3 -->
  <path d="M 620 220 Q 650 240 640 275" stroke="url(#arrowGradient)" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow 3 to 4 -->
  <path d="M 620 325 Q 650 360 620 380" stroke="url(#arrowGradient)" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow 4 to 5 -->
  <path d="M 540 420 Q 480 470 460 450" stroke="url(#arrowGradient)" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow 5 to 6 -->
  <path d="M 340 460 Q 280 470 280 420" stroke="url(#arrowGradient)" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow 6 to 7 -->
  <path d="M 180 380 Q 150 360 160 325" stroke="url(#arrowGradient)" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow 7 to 1 (completing the cycle) -->
  <path d="M 180 275 Q 150 240 160 220 Q 180 170 250 150 Q 300 140 330 145" stroke="url(#arrowGradient)" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Cycle indicator -->
  <text x="400" y="560" text-anchor="middle" fill="#2C3E50" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
    Continuous Development Cycle
  </text>
  <text x="400" y="580" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="11">
    Each phase flows into the next, with maintenance leading back to planning for continuous improvement
  </text>
</svg>