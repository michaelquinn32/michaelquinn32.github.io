<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="400" viewBox="0 0 1080 400" role="img" aria-labelledby="title description">
  <title id="title">Working one level up</title>
  <desc id="description">Two trees divide attention between a human supervisor and agents. The human focuses on the blue parent nodes, PR reviews and Feature epic. Agents focus on three orange pull request nodes and three orange issue nodes below those parents.</desc>
  <rect width="1080" height="400" rx="16" fill="#ffffff"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <text x="540" y="42" fill="#1e3a5f" font-size="23" font-weight="600">My focus: direction, progress and decisions</text>
    <g fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round">
      <path d="M276 150 V196 M116 240 V196 H436 V240 M276 196 V240"/>
      <path d="M804 150 V196 M644 240 V196 H964 V240 M804 196 V240"/>
    </g>
    <g fill="#dbeafe" stroke="#1d4ed8" stroke-width="2">
      <rect x="166" y="76" width="220" height="74" rx="10"/>
      <rect x="694" y="76" width="220" height="74" rx="10"/>
    </g>
    <g fill="#1e3a5f" font-size="25" font-weight="600">
      <text x="276" y="122">PR reviews</text>
      <text x="804" y="122">Feature epic</text>
    </g>
    <g fill="#ffedd5" stroke="#c2410c" stroke-width="2">
      <rect x="44" y="240" width="144" height="66" rx="10"/>
      <rect x="204" y="240" width="144" height="66" rx="10"/>
      <rect x="364" y="240" width="144" height="66" rx="10"/>
      <rect x="572" y="240" width="144" height="66" rx="10"/>
      <rect x="732" y="240" width="144" height="66" rx="10"/>
      <rect x="892" y="240" width="144" height="66" rx="10"/>
    </g>
    <g fill="#7c2d12" font-size="23" font-weight="600">
      <text x="116" y="282">PR #1</text>
      <text x="276" y="282">PR #2</text>
      <text x="436" y="282">PR #3</text>
      <text x="644" y="282">Issue #1</text>
      <text x="804" y="282">Issue #2</text>
      <text x="964" y="282">Issue #3</text>
    </g>
    <text x="540" y="358" fill="#7c2d12" font-size="23" font-weight="600">Agent focus: individual reviews and implementation tasks</text>
  </g>
</svg>
