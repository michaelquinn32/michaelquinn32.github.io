# Site wide configuration

title: Michael Quinn
subtitle: Your Guide to Data Science in the Age of AI
locale: en_US
# For a development URL, follow the pattern from 
# https://docs.github.com/en/codespaces/developing-in-a-codespace/forwarding-ports-in-your-codespace
# url: https://glowing-journey-64r4xr7pv725rr7-4000.app.github.dev
url: https://www.msquinn.com
description: >
    The personal website and blog of Michael Quinn, a Data Scientist who enjoys exploring
    new computational tools and teaching others. Tutorials, musings and other 
    adventures posted every now and then.
twitter_username: michaelquinn32
github_username: michaelquinn32



# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
minimal_mistakes_skin: dark
search: true
# Outputting
permalink: /blog/:year/:month/:day/:title/
paginate: 5 # amount of posts to show
paginate_path: /page:num/
timezone: 	America/Los_Angeles

# Plugins (previously gems:)
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-include-cache
  - jekyll-paginate
  - jekyll-redirect-from
  - jekyll-sitemap
  - jemoji

include: ["_pages"]
exclude: ["post-elements/", "vendor"]
github: [metadata]

author:
  name: Michael Quinn
  avatar: /images/bio-photo.jpg
  bio: "An AI and Data Science veteran. An ex-Googler. A dad. A fan of statistical computing, the great outdoors and other adventurous things."
  email: hello@msquinn.com
  disqus-shortname: michaelquinn32
  twitter: michaelquinn32
  github: michaelquinn32
  linkedin: michaelquinn32
  google:
    analytics: UA-69944402-1
    verify: xQogj-1c3Pnw2lZjKP6_vH0uz_COdCP7XwjJkepiAnc
    tagmanager: GTM-N4X4ZX
    ad-client:
    ad-slot:

footer:
  links:
    - label: "LinkedIn"
      icon: "fa-brands fa-linkedin"
      url: "https://www.linkedin.com/in/michaelquinn32"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/michaelquinn32"
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter-square"
      url: "https://twitter.com/michaelquinn32"

analytics:
  provider: "google-gtag"
  google:
    tracking_id: "G-5Z551RWVK6"
    anonymize_ip: false # default

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
      classes: wide
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single


kramdown:
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  enable_coderay: false

atom_feed:
  path: /blog/feed.atom

feed:
  path: /blog/feed.atom