name: Create Newsletter Draft

on:
  push:
    branches: [master, main]
    paths:
      - '_posts/**'
  workflow_dispatch:
    inputs:
      post_path:
        description: 'Path to post file (e.g., _posts/2025-01-18-my-post.md)'
        required: false
        type: string

jobs:
  create-newsletter:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect new posts
        id: detect
        run: |
          if [ -n "${{ inputs.post_path }}" ]; then
            echo "posts=${{ inputs.post_path }}" >> $GITHUB_OUTPUT
            echo "count=1" >> $GITHUB_OUTPUT
          else
            NEW_POSTS=$(git diff --name-only HEAD~1 HEAD -- '_posts/*.md' 2>/dev/null || echo "")
            
            if [ -z "$NEW_POSTS" ]; then
              echo "No new posts detected"
              echo "count=0" >> $GITHUB_OUTPUT
            else
              POSTS_ONELINE=$(echo "$NEW_POSTS" | tr '\n' ' ' | xargs)
              echo "posts=$POSTS_ONELINE" >> $GITHUB_OUTPUT
              COUNT=$(echo "$NEW_POSTS" | wc -l | xargs)
              echo "count=$COUNT" >> $GITHUB_OUTPUT
              echo "Detected $COUNT new post(s): $POSTS_ONELINE"
            fi
          fi

      - name: Setup Ruby
        if: steps.detect.outputs.count != '0'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build Jekyll site
        if: steps.detect.outputs.count != '0'
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_REPO_NWO: ${{ github.repository }}

      - name: Process posts and create campaigns
        if: steps.detect.outputs.count != '0'
        env:
          MAILERLITE_API_KEY: ${{ secrets.MAILERLITE_API_KEY }}
          FROM_NAME: "Michael Quinn"
          FROM_EMAIL: "hello@msquinn.com"
          REPLY_TO: "msquinn.illinois@gmail.com"
          SITE_URL: "https://www.msquinn.com"
        run: |
          set -e
          
          for POST_PATH in ${{ steps.detect.outputs.posts }}; do
            echo "Processing: $POST_PATH"
            
            # Extract title from frontmatter
            TITLE=$(grep -m1 '^title:' "$POST_PATH" | sed 's/title: *//' | tr -d '"')
            
            # Calculate paths based on permalink pattern: /blog/:year/:month/:day/:title/
            FILENAME=$(basename "$POST_PATH" .md)
            YEAR=$(echo "$FILENAME" | cut -c1-4)
            MONTH=$(echo "$FILENAME" | cut -c6-7)
            DAY=$(echo "$FILENAME" | cut -c9-10)
            SLUG=$(echo "$FILENAME" | cut -c12-)
            
            HTML_PATH="_site/blog/${YEAR}/${MONTH}/${DAY}/${SLUG}/index.html"
            POST_URL="${SITE_URL}/blog/${YEAR}/${MONTH}/${DAY}/${SLUG}/"
            
            echo "Looking for rendered HTML at: $HTML_PATH"
            
            if [ ! -f "$HTML_PATH" ]; then
              echo "Warning: Could not find rendered HTML at $HTML_PATH"
              continue
            fi
            
            # Extract article content to temp file
            ARTICLE_FILE=$(mktemp)
            python3 .github/scripts/extract_article.py "$HTML_PATH" > "$ARTICLE_FILE"
            echo "Extracted article content ($(wc -c < "$ARTICLE_FILE") bytes)"
            
            # Create campaign
            python3 .github/scripts/create_campaign.py "$TITLE" "$POST_URL" "$ARTICLE_FILE"
            
            rm -f "$ARTICLE_FILE"
            echo ""
          done
          
          echo "Done! Check your MailerLite dashboard for draft campaigns."
