name: Create Newsletter Draft

on:
  push:
    branches: [master, main]
    paths:
      - '_posts/**'
  workflow_dispatch:
    inputs:
      post_path:
        description: 'Path to post file (e.g., _posts/2025-01-18-my-post.md)'
        required: false
        type: string

jobs:
  create-newsletter:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect new posts
        id: detect
        run: |
          if [ -n "${{ inputs.post_path }}" ]; then
            echo "posts=${{ inputs.post_path }}" >> $GITHUB_OUTPUT
            echo "count=1" >> $GITHUB_OUTPUT
          else
            NEW_POSTS=$(git diff --name-only HEAD~1 HEAD -- '_posts/*.md' 2>/dev/null || echo "")
            
            if [ -z "$NEW_POSTS" ]; then
              echo "No new posts detected"
              echo "count=0" >> $GITHUB_OUTPUT
            else
              POSTS_ONELINE=$(echo "$NEW_POSTS" | tr '\n' ' ' | xargs)
              echo "posts=$POSTS_ONELINE" >> $GITHUB_OUTPUT
              COUNT=$(echo "$NEW_POSTS" | wc -l | xargs)
              echo "count=$COUNT" >> $GITHUB_OUTPUT
              echo "Detected $COUNT new post(s): $POSTS_ONELINE"
            fi
          fi

      - name: Process posts and create campaigns
        if: steps.detect.outputs.count != '0'
        env:
          MAILERLITE_API_KEY: ${{ secrets.MAILERLITE_API_KEY }}
          FROM_NAME: "Michael Quinn"
          FROM_EMAIL: "hello@msquinn.com"
          REPLY_TO: "msquinn.illinois@gmail.com"
          SITE_URL: "https://www.msquinn.com"
        run: |
          set -e
          
          for POST_PATH in ${{ steps.detect.outputs.posts }}; do
            echo "Processing: $POST_PATH"
            
            # Create campaign and output fields for manual entry
            python3 .github/scripts/create_campaign.py "$POST_PATH"
            
            echo ""
          done
          
          echo "Done! Check your MailerLite dashboard for draft campaigns."
