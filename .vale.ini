StylesPath = styles
MinAlertLevel = suggestion
Vocab = Blog

# Packages installed with `vale sync` (run `mise run vale-sync`):
#  - write-good, proselint, alex, Readability : Vale Hub prose/readability styles.
#  - ai-tells : detects AI-writing tells (structure announcements, rhetorical
#    self-answers, tricolons, sycophancy, buzzwords). Shipped as a release zip,
#    not a Hub name, so it is pinned by URL. Repo: github.com/tbhb/vale-ai-tells.
Packages = write-good, proselint, alex, Readability, https://github.com/tbhb/vale-ai-tells/releases/download/v1.21.0/ai-tells.zip

[*.md]
BasedOnStyles = Vale, write-good, proselint, alex, Readability, ai-tells, Blog

# Readability metrics: keep them as informational SIGNAL, not warnings. The
# Readability package ships thresholds tuned for docs/marketing (grade <= 8,
# reading-ease >= 70); this blog is long-form analytical prose, so those
# thresholds do not apply. Demote to suggestion so the SCORE is reported without
# a misleading pass/fail. Read them for trend, not compliance (see AGENTS.md).
Readability.FleschKincaid = suggestion
Readability.GunningFog = suggestion
Readability.SMOG = suggestion
Readability.AutomatedReadability = suggestion
Readability.ColemanLiau = suggestion
Readability.LIX = suggestion
Readability.FleschReadingEase = suggestion

# HOUSE-STYLE OVERRIDES (deliberate; see AGENTS.md > "Writing QA pipeline"):
#  - ai-tells.SemicolonUsage: ai-tells treats a semicolon joining a comma-free
#    clause as an AI tell (level=error). Michael's voice guide does the opposite;
#    it PREFERS a semicolon over an em dash. Off, so the linter does not fight the
#    author's signature construction.
#  - write-good.E-Prime: flags every use of "to be," which is a fringe stylistic
#    exercise, not a quality signal. Far too noisy for this author. Off.
#  - ai-tells.VerbTricolon: its regex matches any "X, Y, and Z" comma series whose
#    words end in -ing/-ed/-s or follow a modal, so on ordinary prose it is ~90%
#    false positives (two-item lists, adjective series, descriptive sentences) and
#    buries the real findings. The genuine three-parallel-verb tell is rare enough
#    to catch by eye. Off. (Re-enable if you want to police tricolons deliberately.)
ai-tells.SemicolonUsage = NO
write-good.E-Prime = NO
ai-tells.VerbTricolon = NO

# Ignore fenced code blocks, inline code, and bare URLs.
BlockIgnores = (?s)```.*?```
TokenIgnores = (\x60[^\x60]+\x60), (https?://[^\s)]+)
